name: standalone_cine_mesh
description: "A decentralized, AI-driven movie recommendation application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.12.1
  firebase_messaging: ^16.4.3
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  http: ^1.2.2
  encrypt: ^5.0.3
  google_generative_ai: ^0.4.5
  url_launcher: ^6.3.1
  crypto: ^3.0.6
  flutter_local_notifications: ^22.2.0
  shared_preferences: ^2.3.5
  flutter_inappwebview: ^6.1.6
  file_picker: ^8.1.7
  pointycastle: ^3.9.1
  # Universal cross-platform platform interface manager wrapper
  universal_io: ^2.3.1
  web: ^1.1.1
  video_player: ^2.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0 # Standard stable lint engine rule normalization
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  windows:
    generate: true
    image_path: "backend/assets/icons/app_icon.png"
    icon_size: 48
  image_path: "backend/assets/icons/app_icon.png"
  adaptive_icon_background_color: "#ffffff"

flutter:
  uses-material-design: true
  assets:
    # Essential brand interface design variables
    - backend/assets/icons/app_icon.png

    # RECOMMENDATION NOTE: Consider loading these heavy resources asynchronously from cloud
    # buckets (e.g., Firebase Storage) to lower compiled production binary size footprints.
    - backend/core_kernel.ipynb
    - backend/database/tmdb_movie_recommender.db
    - backend/assets/tutorial/tutorial.mp4

# Add this block at the very bottom of your pubspec.yaml file
dependency_overrides:
  web: ^0.5.1

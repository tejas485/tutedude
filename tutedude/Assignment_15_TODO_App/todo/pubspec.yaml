name: todo
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Core Database & Authentication Plugins
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  firebase_messaging: any
  google_sign_in: any

  # State, Theme Persistence, and Security Utilities
  provider: any
  shared_preferences: any
  encrypt: any
  intl: any

  # Overhauled Notification Architecture
  timezone: any
  flutter_local_notifications: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: any
  flutter_lints: any

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/iIcon-192.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  assets:
      - assets/sounds/task_reminder.wav
      - assets/icons/icon.png

  uses-material-design: true
